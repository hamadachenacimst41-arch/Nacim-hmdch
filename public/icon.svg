  <!-- Subtitle Suivi Chantier -->
  <text x="256" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="2">SUIVI CHANTIER</text>
