      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- App Background with smooth corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Main Emblem Container -->
  <rect x="80" y="80" width="352" height="352" rx="56" fill="url(#gcbGrad)" />
  
  <!-- GCB Construction Logo Shape -->
  <path d="M140 180 L256 120 L372 180 L372 320 L256 380 L140 320 Z" fill="#0f172a" fill-opacity="0.95" />
  
